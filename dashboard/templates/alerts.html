{% extends "base.html" %}

{% block content %}
<h3>Alerts</h3>

<table class="table table-dark table-striped table-hover">
    <thead>
        <tr>
            <th>Timestamp</th>
            <th>Type</th>
            <th>Source IP</th>
            <th>Username</th>
            <th>Severity</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>
    {% for a in alerts %}
        <tr>
            <td>{{ a.created_at }}</td>
            <td>{{ a.alert_type }}</td>
            <td>{{ a.src_ip }}</td>
            <td>{{ a.username if a.username else '-' }}</td>
            <td class="severity-{{ a.severity }}">{{ a.severity }}</td>
            <td>{{ a.description }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
