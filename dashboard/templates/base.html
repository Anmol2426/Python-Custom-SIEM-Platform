<!DOCTYPE html>
<html>
<head>
    <title>SIEM Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* 🔹 FORCE severity colors (override bootstrap) */

        .severity-High {
            color: #ff4d4d !important;
        }

        .severity-Medium {
            color: #ffa500 !important;
        }

        .severity-Low {
            color: #4caf50 !important;
        }
    </style>
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-3">
    <a class="navbar-brand" href="/">🛡 SIEM Dashboard</a>
    <div>
        <a href="/alerts" class="btn btn-outline-light btn-sm">Alerts</a>
        <a href="/incidents" class="btn btn-outline-light btn-sm">Incidents</a>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
